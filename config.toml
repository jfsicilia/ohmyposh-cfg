#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }} ({{ .UserName }}@{{ .HostName }})'

# First prompt line (left section)
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  # Vi mode section
  [[blocks.segments]]
    type = "text"
    style = "diamond"
  #  leading_diamond = ""
    trailing_diamond = ''
    template = "{{ if .Env.VI_MODE }} {{ .Env.VI_MODE }} {{ end }}"
    # template = "{{ if .Env.VI_MODE }}{{ end }}"
    foreground = "transparent"
    background = "#eceff4"
    background_templates = [
      "{{if eq .Env.VI_MODE \"N\"}}#87bfce{{end}}",
      "{{if eq .Env.VI_MODE \"I\"}}#eceff4{{end}}",
      "{{if eq .Env.VI_MODE \"V\"}}#79a09f{{end}}",
      "{{if eq .Env.VI_MODE \"R\"}}#ebcb8b{{end}}"
    ]

    [blocks.segments.properties]
      cache_duration = "none"

  # Host name section
  [[blocks.segments]]
    type = 'session'
    style = 'diamond'
    trailing_diamond = ''
    background = '#5e81ac'
    foreground = '#eceff4'
    template = ' {{ .UserName }}@{{ .HostName }} '

  # Path segment
  [[blocks.segments]]
    type = 'path'
    style = 'diamond'
    trailing_diamond = ''
    background = '#4b5468'
    foreground = '#e5e9f0'
    template = ' {{ .Path }} '

    [blocks.segments.properties]
      # style = 'full'
      style = 'agnoster_full'

  # Git segment
  [[blocks.segments]]
    type = "git"
    style = "diamond"
    trailing_diamond = ''
    foreground = "green"
    foreground_templates = [
      "{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}",
      "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#EEC300{{ end }}",
      "{{ if gt .Ahead 0 }}#B388FF{{ end }}",
      "{{ if gt .Behind 0 }}#B388FF{{ end }}"
    ]
    background = "#3b4252"
    template = " {{ .UpstreamIcon }} {{ .HEAD }}{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}{{ if .Staging.Changed }}<#FF6F00>  {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "

    [blocks.segments.properties]
    fetch_status = true
    fetch_upstream_icon = true

# First line prompt (right section)
[[blocks]]
  type = 'prompt'
  alignment = 'right'

  # Python section
  [[blocks.segments]]
    type = "python"
    style = "diamond"
    leading_diamond = ""
    foreground = "yellow"
    background = "#3b4252"
    template = "  {{ .Full }} "    

# Second promt line (left section)
[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  # Command line symbol
  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      "{{if gt .Code 0}}red{{end}}",
      "{{if eq .Code 0}}yellow{{end}}",
    ]
    background = 'transparent'
    template = '❯'

# Second prompt line (right section)
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  # Command's execution time segment.
  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = 'yellow'
    background = 'transparent'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 5000

# After command is executed this is the transient prompt to show.
[transient_prompt]
  foreground_templates = [
    "{{if gt .Code 0}}red{{end}}",
    "{{if eq .Code 0}}yellow{{end}}",
  ]
  background = 'transparent'
  template = '❯ '

# When further prompt lines are required this is what is showed.
[secondary_prompt]
  foreground = 'yellow'
  background = 'transparent'
  template = '❯❯ '

